<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CampusConnect</title>
    <link rel="stylesheet" href="login.css">
    <!-- Bootstrap Icons for password visibility toggle -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-container">
            <div class="login-header">
                <h2 class="animate-title">Welcome Back</h2>
                <p class="animate-subtitle">Sign in to your CampusConnect account</p>
            </div>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group animate-group-1">
                    <label for="roleSelect">Select Role</label>
                    <select id="roleSelect" required>
                        <option value="">-- Choose Role --</option>
                        <option value="admin">Admin</option>
                        <option value="coordinator">Coordinator</option>
                        <option value="host">Host</option>
                        <option value="user">User</option>
                    </select>
                </div>
                <div class="form-group animate-group-2">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Enter username" required>
                </div>
                <div class="form-group animate-group-3">
                    <label for="password">Password</label>
                    <div class="password-container">
                        <input type="password" id="password" placeholder="Enter password" required>
                        <button type="button" id="togglePasswordBtn" class="password-toggle-btn" onclick="togglePasswordVisibility()">
                            <i id="toggleIcon" class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="login-submit-btn">Login</button>
                <p id="errorMsg" class="error-message">Invalid credentials!</p>
            </form>
        </div>
    </div>
    <script src="login.js"></script>
</body>
</html>
