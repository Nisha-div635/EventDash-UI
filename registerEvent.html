
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Registration - Event Management UI</title>
    <link rel="stylesheet" href="registerEvent.css">
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="theme.js"></script>
</head>
<body>
    <!-- Background Animated Gradient Blobs -->
    <div class="bg-animation">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="event-wrapper">
        <div class="event-card">
            <div class="card-header">
                <span class="badge">Attendee Portal</span>
                <h2>Register for Event</h2>
                <p>Secure your spot by filling out your details below.</p>
            </div>
            
            <form id="registrationForm">
                <!-- Full Name -->
                <div class="input-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" required autocomplete="off">
                </div>

                <!-- Email Address -->
                <div class="input-group">
                    <label for="emailAddress">Email Address</label>
                    <input type="email" id="emailAddress" name="emailAddress" placeholder="name@example.com" required autocomplete="off">
                </div>

                <!-- Phone Number -->
                <div class="input-group">
                    <label for="phoneNumber">Phone Number</label>
                    <input type="tel" id="phoneNumber" name="phoneNumber" placeholder="e.g. +91 98765 43210" required autocomplete="off">
                </div>

                <!-- Submit Button -->
                <button type="submit" class="submit-btn" id="submitBtn">
                    <span class="btn-text">Confirm Registration</span>
                    <span class="success-icon">✓</span>
                </button>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
