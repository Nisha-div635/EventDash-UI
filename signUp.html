<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | CampusConnect</title>
    <link rel="stylesheet" href="signup.css">
    <!-- Bootstrap Icons for password visibility toggle -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
    <!-- Background Animated Gradient Blobs -->
    <div class="bg-animation">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="signup-wrapper">
        <div class="signup-container">
            <div class="signup-header">
                <span class="badge">Join Us</span>
                <h2 class="animate-title">Create Account</h2>
                <p class="animate-subtitle">Sign up to get started with CampusConnect</p>
            </div>

            <form id="signupForm" onsubmit="handleSignup(event)">
                <!-- Role Selection -->
                <div class="form-group animate-group-1">
                    <label for="roleSelect">Select Role</label>
                    <select id="roleSelect" required>
                        <option value="" disabled selected>Select Role</option>
                        <option value="User">User</option>
                        <option value="Host">Host</option>
                        <option value="Coordinator">Coordinator</option>
                        <option value="Admin">Admin</option>
                    </select>
                </div>

                <!-- Full Name -->
                <div class="form-group animate-group-2">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" placeholder="Enter your full name" required autocomplete="off">
                </div>

                <!-- Email Address -->
                <div class="form-group animate-group-3">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="name@example.com" required autocomplete="off">
                </div>

                <!-- Password -->
                <div class="form-group animate-group-4">
                    <label for="password">Password</label>
                    <div class="password-container">
                        <input type="password" id="password" placeholder="Create a password" required>
                        <button type="button" id="togglePasswordBtn" class="password-toggle-btn"
                            onclick="togglePasswordVisibility()">
                            <i id="toggleIcon" class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Contact Number -->
                <div class="form-group animate-group-5">
                    <label for="contact">Contact Number</label>
                    <input type="tel" id="contact" placeholder="Enter your phone number" required autocomplete="off">
                </div>

                <!-- OTP Verification Field -->
                <div class="form-group animate-group-6">
                    <label for="otp">OTP Verification</label>
                    <div class="otp-container">
                        <input type="text" id="otp" placeholder="Enter 6-digit OTP" maxlength="6" required>
                        <button type="button" id="resendOtpBtn" class="resend-otp-btn"
                            onclick="handleResendOTP()">Resend OTP</button>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="signup-submit-btn">Sign Up</button>
                <p id="errorMsg" class="error-message">Please fill in all fields correctly!</p>
            </form>
        </div>
    </div>

    <script src="signUp.js"> </script>
</body>

</html>
