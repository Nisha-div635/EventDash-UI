<section class="contact-section">
  <div class="contact-container">


    <div class="contact-text">

      <h1>Get in <span class="d1">Touch</span></h1>
      <p>Send us your query and we'll get back to you within 2-4 business hours.</p>
    </div>



    <div class="contact-form-card">
      <div class="form-field"><label>Name</label><input type="text" placeholder="Your Name" value="Meera Nayak"></div>
      <div class="form-field"><label>Email</label><input type="email" placeholder="Your Email" value="meera.nayak@gmail.com"></div>
      <div class="form-field"><label>Message</label><textarea placeholder="Your Message">Hi, I'd like to know more about hosting a workshop through CampusConnect.</textarea></div>
      <button class="auth-btn">SUBMIT</button>
    </div>
  </div>
</section>
