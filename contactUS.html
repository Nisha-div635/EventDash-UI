<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="contactUS.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <script src="theme.js"></script>
  <title>Contact Us | CampusConnect</title>
</head>

<body>
  <nav>
    <h4 class="logo-name">CAMPUSCONNECT</h4>
    <div class="nav-links">
      <a href="home.html">HOME</a>
      <a href="gallery.html">GALLERY</a>
      <a href="contactUS.html" class="active">CONTACT US</a>
      <a href="help.html">HELPCENTER</a>
    </div>
    <div style="display: flex; align-items: center; gap: 12px;">
      <button class="navbar-theme-toggle" type="button" title="Toggle Light/Dark Mode" aria-label="Toggle theme">
        <i class="bi bi-moon-stars-fill theme-toggle-icon"></i>
      </button>
      <button class="login-btn"><a href="login.html">LOGIN</a></button>
    </div>
  </nav>

  <section class="contact-section">
    <div class="contact-container">


      <div class="contact-text">
        <h1 class="request-heading">Request for Service</h1>
        <h1>Get in <span class="d1">Touch</span></h1>
        <p>Send us your query and we'll get back to you within 2-4 business hours.</p>
      </div>



      <div class="contact-form-card">
        <div class="form-field"><label>Name</label><input type="text" placeholder="Your Name" value="abc"></div>
        <div class="form-field"><label>Email</label><input type="email" placeholder="Your Email" value="abc@gmail.com">
        </div>
        <div class="form-field"><label>Message</label><textarea
            placeholder="Your Message">Hi, I'd like to know more about hosting a workshop through CampusConnect.</textarea>
        </div>
        <button class="auth-btn">SUBMIT</button>
      </div>
    </div>
  </section>

  <div class="footer-section">&copy; 2025-2026 CampusConnect. All rights reserved.</div>

</body>

</html>
